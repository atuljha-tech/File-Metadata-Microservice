<!DOCTYPE html>
<html>
  <head>
    <title>File Metadata</title>
    <link rel="shortcut icon" href="https://cdn.freecodecamp.org/universal/favicons/favicon-32x32.png" type="image/x-icon"/>
    <style>
      body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; background: #f4f4f4; }
      h1 { color: #333; }
      .view { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
      input[type="file"] { margin-bottom: 16px; display: block; }
      input[type="submit"] { background: #007bff; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
      input[type="submit"]:hover { background: #0056b3; }
    </style>
  </head>
  <body>
    <h1>API Project: File Metadata Microservice</h1>
    <h2>Usage:</h2>
    <p>Please Upload a File ...</p>
    <div class="view">
      <form enctype="multipart/form-data" method="post" action="/api/fileanalyse">
        <input id="inputfield" type="file" name="upfile">
        <input id="button" type="submit" value="Upload">
      </form>
    </div>
  </body>
</html>
