<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Metadata Microservice</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 60px auto;
        padding: 0 20px;
        background: #f4f4f4;
      }
      h1 { color: #333; }
      form {
        background: #fff;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      input[type="file"] { margin-bottom: 16px; display: block; }
      input[type="submit"] {
        background: #007bff;
        color: #fff;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      input[type="submit"]:hover { background: #0056b3; }
      #result {
        margin-top: 24px;
        background: #fff;
        padding: 16px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        display: none;
      }
      pre { margin: 0; white-space: pre-wrap; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>File Metadata Microservice</h1>
    <p>Upload a file to get its name, type, and size.</p>

    <form id="upload-form" enctype="multipart/form-data">
      <input type="file" name="upfile" id="upfile" required />
      <input type="submit" value="Upload" />
    </form>

    <div id="result">
      <h3>Response:</h3>
      <pre id="json-output"></pre>
    </div>

    <script>
      document.getElementById("upload-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const formData = new FormData(this);
        const res = await fetch("/api/fileanalyse", {
          method: "POST",
          body: formData,
        });
        const data = await res.json();
        document.getElementById("json-output").textContent = JSON.stringify(data, null, 2);
        document.getElementById("result").style.display = "block";
      });
    </script>
  </body>
</html>
